services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: syntrix-postgres
    restart: unless-stopped
    environment:
       POSTGRES_USER: syntrix
       POSTGRES_PASSWORD: syntrix_dev_password
       POSTGRES_DB: syntrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:8-alpine
    container_name: syntrix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  

volumes:
  postgres_data:
  redis_data:

  

    
    
